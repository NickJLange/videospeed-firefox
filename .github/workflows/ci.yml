name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Build, Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Audit dependencies
        run: nix develop --command npm audit --audit-level=high

      - name: Lint source
        run: nix develop --command npm run lint

      - name: Check types
        run: nix develop --command npm run typecheck

      - name: Build release extension
        run: nix develop --command make build

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(nix develop --command node -p "require('./package.json').version")"

      - name: Validate extension structure
        run: nix develop --command node tests/e2e/validate-extension.ts

      - name: Validate Firefox add-on
        run: nix develop --command web-ext lint --source-dir=dist

      - name: Run tests
        run: nix develop --command npm test

      - name: Install Firefox for regression test
        run: nix develop --command npx puppeteer browsers install firefox

      - name: Test packaged extension in Firefox
        run: nix develop --command npm run test:firefox -- release/videospeed-*.xpi

      - name: Archive matching source for Mozilla and GPL recipients
        run: git archive --format=zip --output=release/videospeed-source.zip HEAD

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: videospeed-firefox-release
          path: |
            release/videospeed-*.xpi
            release/videospeed-source.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: videospeed-firefox-release
          path: release
      - name: Publish unsigned XPI and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Release $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
